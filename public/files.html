    /* =========================================================
       FILES PAGE
       ========================================================= */

    .files-page {

      min-height: calc(100vh - 160px);

      padding: 120px 0 80px;

    }


    /* =========================================================
       GRID
       ========================================================= */

    .files-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 24px;

      width: 100%;

    }


    /* =========================================================
       FILE CARD
       ========================================================= */

     .file-card {

      position: relative;

      display: block;

      width: 100%;

      aspect-ratio: 0.72;

      padding: 0;

      text-decoration: none;

      color: inherit;

      background: #182129;

      border: 1px solid
        rgba(197, 164, 91, 0.28);

      border-radius: 18px;

      overflow: hidden;

      box-shadow:

        0 12px 35px
        rgba(0, 0, 0, 0.22),

        inset 0 1px 0
        rgba(255, 255, 255, 0.025);

      transition:

        transform 0.3s ease,

        border-color 0.3s ease,

        box-shadow 0.3s ease,

        background 0.3s ease;

      /* مهم */

      opacity: 1 !important;

      visibility: visible !important;

      transform: none;

    }


    /* =========================================================
       HOVER
       ========================================================= */

    .file-card:hover {

      transform: translateY(-7px);

      background: #1b2730;

      border-color:
        rgba(197, 164, 91, 0.75);

      box-shadow:

        0 20px 45px
        rgba(0, 0, 0, 0.3),

        0 0 25px
        rgba(197, 164, 91, 0.08);

    }


    /* =========================================================
       PDF PREVIEW CONTAINER
       ========================================================= */

    .pdf-preview {

      position: relative;

      width: 100%;

      height: 100%;

      display: flex;

      align-items: flex-start;

      justify-content: center;

      background: #ffffff;

      overflow: hidden;

    }


    /* =========================================================
       PDF CANVAS
       ========================================================= */

    .pdf-preview canvas {

      display: block;

      width: 100%;

      height: auto;

      min-height: 100%;

      object-fit: cover;

      background: #ffffff;

    }


    /* =========================================================
       LOADING
       ========================================================= */

    .pdf-loading {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #ffffff;

      color: #777;

      font-family:
        "IBM Plex Sans Arabic",
        sans-serif;

      font-size: 13px;

      z-index: 1;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    .pdf-error {

      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 10px;

      padding: 20px;

      text-align: center;

      background: #ffffff;

      color: #555;

      font-family:
        "IBM Plex Sans Arabic",
        sans-serif;

      font-size: 13px;

      z-index: 2;

    }


    .pdf-error strong {

      color: #c62828;

      font-size: 14px;

    }


    /* =========================================================
       GOLD CORNER
       ========================================================= */

    .file-card::before {

      content: "";

      position: absolute;

      top: 0;

      right: 0;

      width: 72px;

      height: 72px;

      background:
        linear-gradient(
          135deg,
          #d6b45d,
          #a77d25
        );

      clip-path:
        polygon(
          100% 0,
          100% 100%,
          0 0
        );

      opacity: 0.95;

      z-index: 5;

      pointer-events: none;

    }


    /* =========================================================
       PDF LABEL
       ========================================================= */

    .file-card::after {

      content: "PDF";

      position: absolute;

      top: 12px;

      right: 13px;

      color: #ffffff;

      font-size: 11px;

      font-family:
        "IBM Plex Sans Arabic",
        sans-serif;

      font-weight: 600;

      letter-spacing: 0.05em;

      z-index: 6;

      pointer-events: none;

    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (max-width: 1200px) {

      .files-grid {

          repeat(3, minmax(0, 1fr));

        font-size: 9px;

      }

<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


  /*
   * PDF.js Worker
   */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


  /*
   * Render first page of PDF
   */

  async function renderPDFPreview(card) {

    const pdfUrl =
      card.getAttribute("href");

    const canvas =
      card.querySelector("canvas");

    const preview =
      card.querySelector(".pdf-preview");

    const loading =
      card.querySelector(".pdf-loading");


    if (
      !pdfUrl ||
      !canvas ||
      !preview
    ) {

      return;

    }


    try {

      /*
       * Load PDF
       */

      const pdf =
        await pdfjsLib
          .getDocument({
            url: pdfUrl
          })
          .promise;


      /*
       * Get FIRST page
       */

      const page =
        await pdf.getPage(1);


      /*
       * Get available width
       */

      const containerWidth =
        preview.clientWidth;


      /*
       * Original PDF size
       */

      const originalViewport =
        page.getViewport({
          scale: 1
        });


      /*
       * Calculate scale
       */

      const scale =
        containerWidth /
        originalViewport.width;


      /*
       * Create scaled viewport
       */

      const viewport =
        page.getViewport({
          scale: scale
        });


      /*
       * Set canvas size
       */

      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;


      /*
       * CSS size
       */

      canvas.style.width =
        viewport.width + "px";

      canvas.style.height =
        viewport.height + "px";


      /*
       * Canvas context
       */

      const context =
        canvas.getContext("2d");


      /*
       * Render PDF page
       */

      await page.render({

        canvasContext:
          context,

        viewport:
          viewport

      }).promise;


      /*
       * Hide loading
       */

      if (loading) {

        loading.style.display =
          "none";

      }


    } catch (error) {

      console.error(
        "PDF Preview Error:",
        pdfUrl,
        error
      );


      /*
       * Remove loading
       */

      if (loading) {

        loading.style.display =
          "none";

      }


      /*
       * Show error

       */

      const errorBox =
        document.createElement("div");


      errorBox.className =
        "pdf-error";


      errorBox.innerHTML = `

        <strong>
          تعذر عرض المعاينة
        </strong>

        <span>
          اضغط لفتح ملف PDF
        </span>

      `;


      preview.appendChild(
        errorBox
      );

    }

  }


  /*
   * Render all cards
   */

  function renderAllPDFs() {

    const cards =
      document.querySelectorAll(
        ".file-card"
      );


    cards.forEach(card => {

      renderPDFPreview(card);

    });

  }


  document.addEventListener("cms:pdfs-loaded", renderAllPDFs);


  /*
   * Initial render
   */

  if (
    document.readyState ===
    "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      renderAllPDFs
    );

  } else {

    renderAllPDFs();

  }


  /*
   * Re-render on resize
   */

  let resizeTimer;


  window.addEventListener(
    "resize",
    () => {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          () => {

            renderAllPDFs();

          },
          300
        );

    }
  );


</script>


<script>
(async function loadCmsPdfs(){
  const grid=document.getElementById('filesGrid'); if(!grid)return;
  try{
    const r=await fetch('/api/pdfs'); if(!r.ok)throw new Error();
    const files=await r.json();
    grid.innerHTML=files.map(f=>`<a class="file-card" href="${escPdf(f.filePath)}" target="_blank" rel="noopener"><div class="pdf-preview"><div class="pdf-loading">جاري تحميل الملف...</div><canvas></canvas></div><div class="file-name">${escPdf(f.title)}</div></a>`).join('')||'<div style="grid-column:1/-1;text-align:center">لا توجد ملفات.</div>';
    document.dispatchEvent(new Event('cms:pdfs-loaded'));
  }catch(e){grid.innerHTML='<div style="grid-column:1/-1;text-align:center">تعذر تحميل الملفات حالياً.</div>';}
  function escPdf(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
})();
</script>
