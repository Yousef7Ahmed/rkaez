<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم ركائز الإعمار</title><style>
*{box-sizing:border-box}body{margin:0;background:#101619;color:#eee;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px}.card{background:#182125;border:1px solid #304047;border-radius:16px;padding:22px;margin-bottom:20px}h1,h2{margin-top:0}input,select,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #3b4a50;background:#0f1518;color:#fff;margin:6px 0 12px}textarea{min-height:90px}button{padding:11px 18px;border:0;border-radius:9px;cursor:pointer;background:#ddd;color:#111;font-weight:700;margin:4px}.danger{background:#8d3030;color:#fff}.muted{color:#9eafb5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{padding:15px;border:1px solid #35464d;border-radius:12px}.item img{width:90px;height:70px;object-fit:cover;border-radius:8px}.tabs button{background:#27353b;color:#fff}.tabs .active{background:#fff;color:#111}.hidden{display:none}.msg{padding:10px;border-radius:8px;margin:8px 0;background:#26373d}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div id="login" class="card"><h1>لوحة تحكم ركائز الإعمار</h1><p class="muted">سجّل الدخول لإدارة المشاريع والملفات.</p><input id="u" placeholder="اسم المستخدم"><input id="pw" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><div id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="card"><h1>إدارة الموقع</h1><button onclick="showTab('projects')">المشاريع</button><button onclick="showTab('pdfs')">الملفات PDF</button><button onclick="logout()">خروج</button></div>
<section id="projects"><div class="card"><h2>إضافة مشروع</h2><form id="projectForm"><div class="grid"><div><label>القسم</label><select name="section"><option value="rakah_a">مشاريع الراكه A</option><option value="rakah_bz">مشاريع الراكه B و Z</option></select></div><div><label>الترتيب</label><input name="order" type="number" value="0"></div></div><input name="title" placeholder="اسم المشروع" required><input name="subtitle" placeholder="الوصف المختصر"><input name="status" placeholder="الحالة"><input name="year" type="number" placeholder="السنة"><textarea name="description" placeholder="وصف المشروع"></textarea><div class="grid"><input name="landArea" placeholder="مساحة الأرض"><input name="builtArea" placeholder="مساحة البناء"><input name="rooms" placeholder="عدد الغرف"></div><label>صور المشروع (حتى 30 صورة)</label><input name="images" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple><button type="submit">إضافة المشروع</button></form><div id="projectMsg"></div></div><div class="card"><h2>المشاريع الحالية</h2><div id="projectList" class="grid"></div></div></section>
<section id="pdfs" class="hidden"><div class="card"><h2>إضافة ملف PDF</h2><form id="pdfForm"><input name="title" placeholder="عنوان الملف" required><select name="category"><option value="warranty">ضمانات</option><option value="certificates">شهادات</option><option value="other">أخرى</option></select><input name="order" type="number" value="0"><input name="file" type="file" accept="application/pdf" required><button type="submit">إضافة الملف</button></form><div id="pdfMsg"></div></div><div class="card"><h2>الملفات الحالية</h2><div id="pdfList" class="grid"></div></div></section></div></div>
<script>
const $=s=>document.querySelector(s);async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function check(){const x=await api('/api/auth/me');if(x.authenticated){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadAll()}}async function login(){try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#pw').value})});location.reload()}catch(e){$('#loginMsg').textContent=e.message}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}
function showTab(t){document.querySelectorAll('#projects,#pdfs').forEach(x=>x.classList.add('hidden'));$('#'+t).classList.remove('hidden')}
async function loadAll(){const [ps,fs]=await Promise.all([api('/api/projects'),api('/api/pdfs')]);$('#projectList').innerHTML=ps.map(p=>`<div class="item"><b>${esc(p.title)}</b><div class="muted">${p.section==='rakah_a'?'الراكه A':'الراكه B و Z'}</div>${p.images?.[0]?`<img src="${esc(p.images[0].path)}">`:''}<br><button class="danger" onclick="delProject('${p._id}')">حذف</button></div>`).join('')||'<p>لا توجد مشاريع.</p>';$('#pdfList').innerHTML=fs.map(f=>`<div class="item"><b>${esc(f.title)}</b><br><a href="${esc(f.filePath)}" target="_blank">فتح PDF</a><br><button class="danger" onclick="delPdf('${f._id}')">حذف</button></div>`).join('')||'<p>لا توجد ملفات.</p>'}
$('#projectForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/projects',{method:'POST',body:new FormData(e.target)});e.target.reset();$('#projectMsg').textContent='تمت إضافة المشروع بنجاح';loadAll()}catch(x){$('#projectMsg').textContent=x.message}};
$('#pdfForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/pdfs',{method:'POST',body:new FormData(e.target)});e.target.reset();$('#pdfMsg').textContent='تمت إضافة الملف بنجاح';loadAll()}catch(x){$('#pdfMsg').textContent=x.message}};
async function delProject(id){if(confirm('حذف المشروع؟')){await api('/api/admin/projects/'+id,{method:'DELETE'});loadAll()}}async function delPdf(id){if(confirm('حذف الملف؟')){await api('/api/admin/pdfs/'+id,{method:'DELETE'});loadAll()}}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}check();
</script></body></html>
